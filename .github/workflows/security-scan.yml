name: '[Security] Security Check - TEST'

# MODIFIED FOR TESTING: Triggers on any push to test the workflow
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check_for_locked_file_changes:
    name: Check for package-lock changes
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
      has_node: ${{ steps.detect-node.outputs.has_node }}
      alert_lines: ${{ steps.changed-files.outputs.alert_lines }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for package.json changes
        id: changed-files
        run: |
          set -euo pipefail

          # Determine base and head commits based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "Checking PR: comparing $BASE_SHA...$HEAD_SHA"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            echo "Checking push: comparing $BASE_SHA...$HEAD_SHA"
          fi

          # Run the Python script to detect dependency changes
          OUTPUT=$(python3 .github/scripts/detect_package_changes.py "$BASE_SHA" "$HEAD_SHA")

          # Parse the output
          ANY_CHANGED=$(echo "$OUTPUT" | grep "any_changed=" | cut -d= -f2)
          echo "any_changed=$ANY_CHANGED" >> "$GITHUB_OUTPUT"

          # Extract alert lines between markers
          ALERT_LINES=$(echo "$OUTPUT" | sed -n '/=== ALERT_LINES ===/,/=== END_ALERT_LINES ===/p' | grep -v "===" || true)

          echo "alert_lines<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ALERT_LINES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Print the status messages (they're in the output)
          echo "$OUTPUT" | grep -E "(✅|❌)"

      - name: Detect whether repository has Node packages
        id: detect-node
        run: |
          # Detect presence of package.json files tracked in the repo
          set -euo pipefail
          if git ls-files | grep -q 'package\.json$'; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug changed files output
        run: |
          echo "The value of 'any_changed' is ${{ steps.changed-files.outputs.any_changed }}"
          echo "The value of 'has_node' is ${{ steps.detect-node.outputs.has_node }}"

      - name: Cache uv installation
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cache/uv
          key: ${{ runner.os }}-uv-guarddog-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-uv-guarddog-

      - name: Install uv for GuardDog
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if ! command -v uv &> /dev/null; then
            echo "🔄 Installing uv (will be cached for next run)..."
            curl -LsSf https://astral.sh/uv/install.sh | sh
          else
            echo "✅ Using cached uv installation"
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create workflow summary
        run: |
          echo "# 📦 Package Change Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]; then
            echo "## ⚠️ Dependency Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** Package dependencies have been modified and require approval." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Changes:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.changed-files.outputs.alert_lines }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract package names and versions, then fetch npm info
            echo "### 📋 Package Information" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Parse alert_lines to extract package names and versions
            ALERT_LINES="${{ steps.changed-files.outputs.alert_lines }}"

            # Extract package info using grep and awk
            while IFS= read -r line; do
              # Extract package name from the alert line
              PKG_NAME=$(echo "$line" | grep -oP '(dependencies|devDependencies|peerDependencies|optionalDependencies)\.\K[^ ]+' || true)

              if [ -n "$PKG_NAME" ] && [ "$PKG_NAME" != "version" ] && [ "$PKG_NAME" != "name" ]; then
                # Read the actual version from package.json for this package
                ACTUAL_VERSION=$(jq -r ".dependencies[\"$PKG_NAME\"] // .devDependencies[\"$PKG_NAME\"] // .peerDependencies[\"$PKG_NAME\"] // .optionalDependencies[\"$PKG_NAME\"] // \"\"" package.json)

                # Strip semver prefix (^, ~, >=, etc) to get clean version number
                CLEAN_VERSION=$(echo "$ACTUAL_VERSION" | sed 's/^[^0-9]*//')

                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary><strong>📦 $PKG_NAME</strong> @ $ACTUAL_VERSION</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY

                # Run npm info and capture output
                if [ -n "$CLEAN_VERSION" ]; then
                  {
                    echo "📌 Scanning version: $CLEAN_VERSION"
                    echo "   (from package.json: $ACTUAL_VERSION)"
                    echo ""
                    NPM_OUTPUT=$(npm info "$PKG_NAME@$CLEAN_VERSION" 2>&1)
                    # Show npm output but filter confusing "latest:" line
                    echo "$NPM_OUTPUT" | grep -v "^latest:" || echo "$NPM_OUTPUT"
                  } >> $GITHUB_STEP_SUMMARY
                else
                  npm info "$PKG_NAME" 2>&1 >> $GITHUB_STEP_SUMMARY
                fi

                echo '```' >> $GITHUB_STEP_SUMMARY

                # Analyze npm info output and provide recommendations
                {
                  echo ""
                  echo "**📊 Analysis & Recommendations:**"
                  echo ""

                  # Check for deprecation
                  if echo "$NPM_OUTPUT" | grep -qi "DEPRECATED"; then
                    echo "- ⚠️ **This package version is deprecated**"
                    echo "  - Action: Consider upgrading to a non-deprecated version or finding an alternative"
                  fi

                  # Check for security vulnerabilities in dependencies
                  if echo "$NPM_OUTPUT" | grep -qi "vulnerabilit"; then
                    echo "- 🔴 **Known security vulnerabilities detected**"
                    echo "  - Action: Review vulnerability details and upgrade to a patched version"
                  fi

                  # Check published date to see if version is old
                  PUB_DATE=$(echo "$NPM_OUTPUT" | grep -oP "published.*ago" || echo "")
                  if [ -n "$PUB_DATE" ]; then
                    if echo "$PUB_DATE" | grep -qE "[3-9] years ago|[1-9][0-9]+ years ago"; then
                      echo "- ⏰ **This version is 3+ years old** ($PUB_DATE)"
                      echo "  - Action: Check if newer versions are available with security fixes and improvements"
                    fi
                  fi

                  # If no issues found
                  if ! echo "$NPM_OUTPUT" | grep -qi "DEPRECATED\|vulnerabilit"; then
                    echo "- ✅ **No obvious issues detected in npm registry data**"
                    echo "  - Next: Review GuardDog security scan below for malware analysis"
                  fi
                } >> $GITHUB_STEP_SUMMARY

                echo "</details>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            done < <(echo "$ALERT_LINES" | grep -E "(added|changed|removed)")

            # GuardDog Security Scan - Always show this section
            echo "### 🔒 GuardDog Security Analysis" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Check if there are any packages to scan
            PACKAGES_TO_SCAN=$(echo "$ALERT_LINES" | grep -E "(added|changed)" | grep -oP '(dependencies|devDependencies|peerDependencies|optionalDependencies)\.\K[^ ]+' | grep -v "^$" || true)

            if [ -z "$PACKAGES_TO_SCAN" ]; then
              echo "ℹ️ No npm packages to scan (only metadata or script changes detected)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            else
              # Scan each package with GuardDog
              while IFS= read -r line; do
                # Extract package name from the alert line
                PKG_NAME=$(echo "$line" | grep -oP '(dependencies|devDependencies|peerDependencies|optionalDependencies)\.\K[^ ]+' || true)

                # Only skip package.json metadata fields, NOT dependency version changes
                if [ -n "$PKG_NAME" ]; then
                # Read the actual version from package.json for this package
                ACTUAL_VERSION=$(jq -r ".dependencies[\"$PKG_NAME\"] // .devDependencies[\"$PKG_NAME\"] // .peerDependencies[\"$PKG_NAME\"] // .optionalDependencies[\"$PKG_NAME\"] // \"\"" package.json)

                # Strip semver prefix (^, ~, >=, etc) to get clean version number
                CLEAN_VERSION=$(echo "$ACTUAL_VERSION" | sed 's/^[^0-9]*//')

                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary><strong>🔍 $PKG_NAME</strong> @ $ACTUAL_VERSION - Security Scan</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY

                # Run GuardDog scan and capture output
                if [ -n "$CLEAN_VERSION" ]; then
                  {
                    echo "🎯 **GuardDog scanning version: $CLEAN_VERSION**"
                    echo "   (from package.json: $ACTUAL_VERSION)"
                    echo ""
                    echo '```'
                    SCAN_OUTPUT=$(uvx guarddog npm scan "$PKG_NAME" --version "$CLEAN_VERSION" 2>&1 || true)

                    # Check if any issues were found
                    ISSUES=$(echo "$SCAN_OUTPUT" | grep -i "found.*indicator\|malicious\|suspicious\|warning" | grep -v "0 issues\|No suspicious" || true)

                    if [ -n "$ISSUES" ]; then
                      echo "⚠️ **Potential Issues Detected**"
                      echo ""
                      # Show all output except installation logs
                      echo "$SCAN_OUTPUT" | grep -v "Installing\|Downloading\|Resolving\|Prepared\|Audited\|packages in"
                    else
                      echo "✅ **Clean - No malicious indicators detected**"
                      INSTALL_INFO=$(echo "$SCAN_OUTPUT" | grep "Installed.*packages in" || echo "")
                      if [ -n "$INSTALL_INFO" ]; then
                        echo ""
                        echo "$INSTALL_INFO"
                      fi
                    fi
                    echo '```'

                    # Analyze GuardDog results and provide recommendations
                    echo ""
                    echo "**📊 Security Analysis & Recommendations:**"
                    echo ""

                    if [ -n "$ISSUES" ]; then
                      # Analyze types of issues found
                      if echo "$SCAN_OUTPUT" | grep -qi "exfiltrat"; then
                        echo "- 🔴 **CRITICAL: Data exfiltration indicators found**"
                        echo "  - Action: DO NOT APPROVE - This package may steal sensitive data"
                        echo "  - Next: Investigate the package source and consider alternatives"
                      fi

                      if echo "$SCAN_OUTPUT" | grep -qi "obfuscat"; then
                        echo "- ⚠️ **WARNING: Code obfuscation detected**"
                        echo "  - Action: Review why code is obfuscated - may hide malicious behavior"
                        echo "  - Next: Check package reputation and maintainer credibility"
                      fi

                      if echo "$SCAN_OUTPUT" | grep -qi "network\|http\|fetch\|request"; then
                        echo "- ⚠️ **Network activity detected**"
                        echo "  - Action: Verify the network calls are legitimate and expected"
                        echo "  - Next: Review what data is being sent and to which domains"
                      fi

                      if echo "$SCAN_OUTPUT" | grep -qi "eval\|exec"; then
                        echo "- ⚠️ **Dynamic code execution detected**"
                        echo "  - Action: Review eval/exec usage - can be exploited for code injection"
                        echo "  - Next: Ensure dynamic code execution is necessary and safe"
                      fi

                      echo ""
                      echo "- 🛑 **RECOMMENDATION: Request security team review before approval**"

                    else
                      echo "- ✅ **No malicious indicators detected by GuardDog**"
                      echo "- ✅ **Package appears safe based on static analysis**"
                      echo ""
                      echo "**Recommended Next Steps:**"
                      echo "1. Verify this is the intended package version ($CLEAN_VERSION)"
                      echo "2. Review npm info above for deprecation/vulnerability warnings"
                      echo "3. If all checks pass, approve the workflow to continue"
                    fi
                  } >> $GITHUB_STEP_SUMMARY
                else
                  {
                    echo '```'
                    SCAN_OUTPUT=$(uvx guarddog npm scan "$PKG_NAME" 2>&1 || true)

                    # Check if any issues were found
                    ISSUES=$(echo "$SCAN_OUTPUT" | grep -i "found.*indicator\|malicious\|suspicious\|warning" | grep -v "0 issues\|No suspicious" || true)

                    if [ -n "$ISSUES" ]; then
                      echo "⚠️ **Potential Issues Detected**"
                      echo ""
                      echo "$SCAN_OUTPUT" | grep -v "Installing\|Downloading\|Resolving\|Prepared\|Audited\|packages in"
                    else
                      echo "✅ **Clean - No malicious indicators detected**"
                      INSTALL_INFO=$(echo "$SCAN_OUTPUT" | grep "Installed.*packages in" || echo "")
                      if [ -n "$INSTALL_INFO" ]; then
                        echo ""
                        echo "$INSTALL_INFO"
                      fi
                    fi
                    echo '```'

                    # Analyze results
                    echo ""
                    echo "**📊 Security Analysis:**"
                    echo ""
                    if [ -n "$ISSUES" ]; then
                      echo "- 🛑 **Issues found - Review required before approval**"
                    else
                      echo "- ✅ **No malicious indicators detected**"
                      echo "- Next: Review and approve if all checks pass"
                    fi
                  } >> $GITHUB_STEP_SUMMARY
                fi

                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "</details>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                fi
              done < <(echo "$ALERT_LINES" | grep -E "(added|changed)")
            fi

            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🎯 Overall Recommendation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Based on the security scans above:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ If all packages show clean scans:" >> $GITHUB_STEP_SUMMARY
            echo "1. ✓ Verify the package versions match your intentions" >> $GITHUB_STEP_SUMMARY
            echo "2. ✓ Check for any deprecation or vulnerability warnings in npm info" >> $GITHUB_STEP_SUMMARY
            echo "3. ✓ Approve the **'Request bypass approval'** job below to continue the workflow" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ If any issues were detected:" >> $GITHUB_STEP_SUMMARY
            echo "1. ⚠ Review the specific security analysis and recommendations above" >> $GITHUB_STEP_SUMMARY
            echo "2. ⚠ Investigate flagged issues before proceeding" >> $GITHUB_STEP_SUMMARY
            echo "3. ⚠ Consider consulting security team for critical findings" >> $GITHUB_STEP_SUMMARY
            echo "4. ⚠ Only approve if you understand and accept the risks" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚫 DO NOT APPROVE if:" >> $GITHUB_STEP_SUMMARY
            echo "- Data exfiltration indicators are present" >> $GITHUB_STEP_SUMMARY
            echo "- Package is deprecated with known security issues" >> $GITHUB_STEP_SUMMARY
            echo "- You don't recognize the package or version change" >> $GITHUB_STEP_SUMMARY
            echo "- Multiple suspicious indicators are detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ No Dependency Changes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** No package dependency changes detected." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Either package.json was not modified, or only non-dependency fields (like scripts) were changed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result:** No approval required, workflow will proceed automatically." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  check_approval_label:
    name: Check PR for existing approval label
    runs-on: ubuntu-latest
    outputs:
      has_approval_label: ${{ steps.check.outputs.has_approval_label }}
    steps:
      - name: Check for package-scan-complete label
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Default to false for non-PR events
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "has_approval_label=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_NUMBER=${{ github.event.pull_request.number }}
          RESP=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}")
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          resp=json.load(sys.stdin)
          labels=[l.get('name','') for l in resp.get('labels',[])]
          print('has_approval_label=true' if 'package-scan-complete' in labels else 'has_approval_label=false')
          PY

  request_bypass_approval:
    name: Request bypass approval
    runs-on: ubuntu-latest
    needs: [check_for_locked_file_changes, check_approval_label]
    # Only run approval job when package changes detected AND node present AND no existing approval label
    if: needs.check_for_locked_file_changes.outputs.any_changed == 'true' && needs.check_for_locked_file_changes.outputs.has_node == 'true' && needs.check_approval_label.outputs.has_approval_label == 'false'
    # TEST: Environment commented out for testing (you may not have this environment configured)
    # environment: bypass-package-lock
    steps:
      - run: echo "Approval required for package dependency changes. An admin from the required group must approve this step."
      - name: Add package-scan-complete label to PR so future pushes don't require repeated approval
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "Adding label 'package-scan-complete' to PR #$PR_NUMBER"
          curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
            -d '{"labels":["package-scan-complete"]}' || true

  notify_package_change:
    name: Notify package.json change
    needs: check_for_locked_file_changes
    if: needs.check_for_locked_file_changes.outputs.any_changed == 'true' && needs.check_for_locked_file_changes.outputs.has_node == 'true'
    # TEST: Slack notification disabled for testing - uncomment if you want to test with Slack
    # uses: ./.github/workflows/start_slack_thread.yml
    # secrets: inherit
    # with:
    #   channel_name: va-mobile-build-alerts
    #   message: |
    #     :information_source: package.json package-related changes detected
    #     *Repository*: ${{ github.repository }}
    #     *Ref*: ${{ github.ref }}
    #     *Run*: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>
    #     *Changes detected:*
    #     ```
    #     ${{ needs.check_for_locked_file_changes.outputs.alert_lines }}
    #     ```
    runs-on: ubuntu-latest
    steps:
      - name: Mock Slack Notification
        run: |
          echo "📢 TEST MODE: Slack notification would be sent here"
          echo "Message content:"
          echo "---"
          echo "package.json package-related changes detected"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Changes detected:"
          echo "${{ needs.check_for_locked_file_changes.outputs.alert_lines }}"

  security-check:
    name: security-check
    runs-on: ubuntu-latest
    needs: [check_for_locked_file_changes, request_bypass_approval]
    if: |
      always() && (
        needs.check_for_locked_file_changes.outputs.any_changed == 'false' ||
        (needs.check_for_locked_file_changes.outputs.any_changed == 'true' && needs.request_bypass_approval.result == 'success')
      )
    # TEST: Security scan disabled for testing - this requires specific GitHub App credentials
    steps:
      - name: Mock Security Scan
        run: |
          echo "🔒 TEST MODE: Security scan would run here"
          echo "In production, this would use gensecaihq/Shai-Hulud-2.0-Detector@v1"
          echo "For testing purposes, we're skipping the actual security scan"
          echo "✅ Mock security check passed"
